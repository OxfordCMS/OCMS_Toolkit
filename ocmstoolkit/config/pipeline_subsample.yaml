# Configuration for the ocms_toolkit subsample pipeline.
#
# Created with:  ocms_toolkit subsample config
# Checked with:  ocms_toolkit subsample full --dry
# Run with:      ocms_toolkit subsample full --jobs <N>
#
# Relative paths are relative to the directory the pipeline is run from.

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------

# Directory containing the FASTQ files: <sample>.fastq.gz (single end) or
# <sample>.fastq.1.gz and <sample>.fastq.2.gz (paired end).
input_dir: "input.dir"

# ---------------------------------------------------------------------------
# seqtk
# ---------------------------------------------------------------------------
#
# job_threads:  CPUs per job.
# job_memory:   memory per CPU (e.g. 4G); a job receives
#               job_memory x job_threads in total.
# job_runtime:  wall time in minutes; if empty, the partition default applies.

seqtk:
  # Number of reads to keep from each file.
  depth: 1000
  # Random seed. The same seed is used for every file, so that both files of
  # a read pair keep the same reads.
  seed: 100
  job_threads: 1
  job_memory: 15G
  job_runtime:

# ---------------------------------------------------------------------------
# Slurm
# ---------------------------------------------------------------------------
#
# Applied to every job the pipeline submits. List the accounts available to
# you with:  sacctmgr show associations user=$USER format=Account

resources:
  slurm_account: "your_slurm_account"
  slurm_partition: "short"
