# Configuration for the ocms_toolkit sra pipeline.
#
# Created with:  ocms_toolkit sra config
# Checked with:  ocms_toolkit sra full --dry
# Run with:      ocms_toolkit sra full --jobs <N>
#
# Relative paths are relative to the directory the pipeline is run from.

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------

# BioProject accession; recorded in README.md only.
bioproject: ""

# Download script generated by the ENA Browser ("Download all"). Each line
# downloads one file.
ena_script: ""

# ---------------------------------------------------------------------------
# Downloads
# ---------------------------------------------------------------------------
#
# Downloads need internet access, so they run on the node from which the
# pipeline is launched, not as Slurm jobs.

download:
  # Maximum number of files downloaded at the same time.
  max_parallel: 4

# ---------------------------------------------------------------------------
# MD5 checksums (Slurm jobs)
# ---------------------------------------------------------------------------
#
# job_memory:   memory per CPU (e.g. 1G).
# job_runtime:  wall time in minutes; if empty, the partition default applies.

checksums:
  job_memory: 1G
  job_runtime:

# ---------------------------------------------------------------------------
# Slurm
# ---------------------------------------------------------------------------
#
# Applied to every job the pipeline submits. List the accounts available to
# you with:  sacctmgr show associations user=$USER format=Account

resources:
  slurm_account: "your_slurm_account"
  slurm_partition: "short"
